# EncryptionConfiguration for kube-apiserver (encryption of Secrets at rest in
# etcd). Rendered by scripts/02-create-cluster.sh, which generates a fresh
# 32-byte key (head -c 32 /dev/urandom | base64) and passes it to
# `kops create secret encryptionconfig -f -`. The rendered file is never written
# to the repo; the key lives only in the kops state store (S3, private bucket).
# aescbc is used because it is supported on every Kubernetes version; for
# production prefer a KMS provider so the key is not stored next to the data.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - aescbc:
          keys:
            - name: key1
              secret: ${ENCRYPTION_KEY}
      # identity last: lets the API server still READ any pre-existing
      # unencrypted secrets; new writes use aescbc (first provider).
      - identity: {}
