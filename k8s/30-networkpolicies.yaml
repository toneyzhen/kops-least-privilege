# Default-deny in both namespaces, then explicit allows.
# REQUIRES a CNI that enforces NetworkPolicy (kops: networking.cilium or calico).
# kops' default (kubenet / plain AWS VPC CNI without policy engine) would
# silently ignore these objects.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-a
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: demo-app
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# demo-app: DNS to kube-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: demo-app
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# demo-app: HTTPS to AWS APIs (STS, S3) but never the metadata service.
# Belt-and-suspenders with the instance metadata hop limit of 1 set by kops.
# Note: pod-level policies are evaluated before node NAT, so the except
# on 169.254.169.254/32 is effective. Port 80 (IMDS) is also simply not allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress-no-imds
  namespace: demo-app
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
