# IRSA demo workload. Rendered with envsubst (needs DEMO_DATA_BUCKET, AWS_REGION).
#
# How the pod gets AWS credentials: kops creates an IAM role for SA
# demo-app/s3-reader (spec.iam.serviceAccountExternalPermissions) and, with the
# podIdentityWebhook addon enabled, the webhook mutates pods using that SA to add
# a projected SA token and AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE. kops
# configures the webhook with the SA->role mapping itself, so the usual
# eks.amazonaws.com/role-arn annotation is NOT required (it is only an override).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: demo-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader
  namespace: demo-app
  # Optional override only; kops/webhook already know the mapping:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/s3-reader.demo-app.sa.${CLUSTER_NAME}
#
# The Kubernetes API token is not needed (the pod never talks to the K8s API).
# The AWS web-identity token is a separate projected volume added by the webhook
# and is unaffected by this setting.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-reader-demo
  namespace: demo-app
  labels:
    app: s3-reader-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-reader-demo
  template:
    metadata:
      labels:
        app: s3-reader-demo
    spec:
      serviceAccountName: s3-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Explicit fsGroup so the projected web-identity token is group-readable
        # by uid 1000 (the webhook would otherwise pick its own fsGroup).
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.15.30
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is "aws"; override it to run a shell loop.
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                echo "=== $(date -u +%FT%TZ) ==="
                # 1. Who am I? Expect assumed-role/s3-reader.demo-app.sa.<cluster>/...
                id=$(aws sts get-caller-identity --query Arn --output text 2>&1) \
                  && echo "[identity] $id" || echo "[identity] ERROR $id"

                # 2. Allowed prefix: expect the file contents.
                if out=$(aws s3 cp "s3://${DEMO_DATA_BUCKET}/allowed/hello.txt" - 2>&1); then
                  echo "[allowed] OK: $out"
                else
                  echo "[allowed] FAIL: $out"
                fi

                # 3. Forbidden prefix: expect 403 / AccessDenied.
                if out=$(aws s3 cp "s3://${DEMO_DATA_BUCKET}/forbidden/secret.txt" - 2>&1); then
                  echo "[forbidden] UNEXPECTED_SUCCESS: $out"
                else
                  case "$out" in
                    *403*|*Forbidden*|*AccessDenied*) echo "[forbidden] DENIED (expected): $out" ;;
                    *) echo "[forbidden] ERROR (not an access denial): $out" ;;
                  esac
                fi

                # 4. Instance metadata (node credentials): expect unreachable.
                #    The image has no curl, so use bash's /dev/tcp with a 2s timeout.
                if timeout 2 bash -c 'exec 3<>/dev/tcp/169.254.169.254/80' 2>/dev/null; then
                  echo "[imds] REACHABLE (BAD)"
                else
                  echo "[imds] BLOCKED (expected)"
                fi
                sleep 60
              done
          env:
            - name: DEMO_DATA_BUCKET
              value: "${DEMO_DATA_BUCKET}"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            # root fs is read-only: HOME must be writable for the CLI cache.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
