# Namespaces with Pod Security Admission (PSA) at the "restricted" profile.
#
# Version pinning:
#   enforce-version is pinned to v1.30 so that a Kubernetes upgrade cannot silently
#   tighten (or change) what is *blocked* and break running rollouts. The pin is
#   honoured as long as it is <= the API server version; if the cluster is older,
#   Kubernetes falls back to "latest". audit/warn use "latest" so that, after an
#   upgrade, you get early warnings about what the NEXT enforce bump would reject.
#   Bump enforce-version deliberately, after reading the audit/warn output.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    app.kubernetes.io/part-of: lp-demo
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.30
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/part-of: lp-demo
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.30
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
