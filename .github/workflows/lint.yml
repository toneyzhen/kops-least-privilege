name: lint

on:
  push:
  pull_request:

permissions:
  contents: read   # least privilege for CI, too

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck gettext-base jq
          pip install --quiet yamllint pyyaml

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Render templates with sample config
        run: |
          set -a; source config.env.example; set +a
          export ENCRYPTION_KEY="$(head -c 32 /dev/urandom | base64)"
          mkdir -p .rendered
          for f in $(find iam kops k8s -type f \( -name '*.json' -o -name '*.yaml' \)); do
            mkdir -p ".rendered/$(dirname "$f")"
            envsubst < "$f" > ".rendered/$f"
          done

      - name: Validate JSON policies
        run: find .rendered -name '*.json' -print0 | xargs -0 -n1 sh -c 'jq empty "$0" && echo "ok $0"'

      - name: Validate YAML manifests
        run: |
          find .rendered -name '*.yaml' -print0 | xargs -0 -n1 python3 -c \
            'import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1]))); print("ok", sys.argv[1])'
